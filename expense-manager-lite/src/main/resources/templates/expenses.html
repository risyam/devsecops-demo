<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>View Expenses</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header - Standardized across all pages */
        .header {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin: 0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
        }

        .user-name {
            color: #555;
            font-weight: 500;
        }

        .logout-btn {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.3s;
            font-size: 14px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .logout-btn:hover {
            background: #5568d3;
        }

        /* Page Content */
        .page-title {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 600;
        }

        table {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 15px 20px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        td {
            background-color: #f9f9f9;
            border-bottom: 1px solid #e9ecef;
        }

        tr:nth-child(even) td {
            background-color: #ffffff;
        }

        tr:hover td {
            background-color: #f0f3ff;
        }

        button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #c82333;
            transform: scale(1.05);
        }

        /* Flash Messages */
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-edit, .btn-delete {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-edit {
            background: #667eea;
            color: white;
        }

        .btn-edit:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .no-expenses {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
        }

        /* Centering the links below the table */
        .link-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .link-container a {
            font-size: 16px;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
        }

        .link-container a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .header h1 {
                font-size: 24px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Standardized Header -->
        <div class="header">
            <h1>💰 Expense Manager</h1>
            <div class="user-info">
                <img th:if="${currentUser.pictureUrl}" 
                     th:src="${currentUser.pictureUrl}" 
                     alt="Profile" 
                     class="user-avatar"
                     onerror="this.style.display='none'">
                <span class="user-name" th:text="${currentUser.name}">User Name</span>
                <form method="post" action="/logout" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </div>
        </div>

        <h2 class="page-title">All Expenses</h2>

        <!-- Flash Messages -->
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <table>
        <thead>
            <tr>
                <th>Description</th>
                <th>Amount (₹)</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(expenses)}">
                <td colspan="5" class="no-expenses">
                    No expenses found. Add your first expense to get started!
                </td>
            </tr>
            <tr th:each="expense : ${expenses}">
                <td th:text="${expense.description}"></td>
                <td>₹<span th:text="${#numbers.formatDecimal(expense.amount, 1, 2)}">0.00</span></td>
                <td th:text="${expense.category.name}"></td>
                <td th:text="${#temporals.format(expense.date, 'MMM dd, yyyy')}"></td>
                <td>
                    <div class="action-buttons">
                        <a th:href="@{/edit-expense/{id}(id=${expense.id})}" class="btn-edit">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <form th:action="@{/delete-expense/{id}(id=${expense.id})}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this expense?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-delete">
                                <i class="fas fa-trash-alt"></i> Delete
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
        <!-- Centered link container for navigation links -->
        <div class="link-container">
            <a th:href="@{/add-expense}">➕ Add Expense</a>
            <a th:href="@{/home}">🏠 Return to Dashboard</a>
        </div>
    </div>
</body>

</html>
