<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>View Expenses</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #007BFF;
            color: white;
            font-weight: bold;
        }

        td {
            background-color: #f9f9f9;
        }

        tr:nth-child(even) td {
            background-color: #f1f1f1;
        }

        tr:hover td {
            background-color: #e2e6ea;
        }

        button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }

        button:hover {
            background-color: #c82333;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
            color: #007BFF;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .delete-icon {
            color: #007BFF;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s;
            border: none;
            background: none;
        }

        .delete-icon:hover {
            color: #0056b3;
        }
        /* Centering the links below the table */
        .link-container {
            display: flex;
            justify-content: center;
            gap: 20px; /* Space between links */
            margin-top: 20px;
        }

        .link-container a {
            font-size: 16px;
            color: #007BFF;
            text-decoration: none;
        }

        .link-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>All Expenses</h1>
    <table>
        <thead>
            <tr>
                <th>Description</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="expense : ${expenses}">
                <td th:text="${expense.description}"></td>
                <td th:text="${expense.amount}"></td>
                <td th:text="${expense.category.name}"></td>
                <td th:text="${expense.date}"></td>
                <td>
                    <form th:action="@{/delete-expense/{id}(id=${expense.id})}" method="post" style="display: inline;">
                        <button type="submit" class="delete-icon">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <!-- Centered link container for navigation links -->
    <div class="link-container">
        <a th:href="@{/add-expense}">Add Expense</a>
        <a th:href="@{/}">Back to Home</a>
    </div>
</body>

</html>
