<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Expense</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header - Standardized across all pages */
        .header {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin: 0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
        }

        .user-name {
            color: #555;
            font-weight: 500;
        }

        .logout-btn {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.3s;
            font-size: 14px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .logout-btn:hover {
            background: #5568d3;
        }

        /* Page Content */
        .page-title {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 600;
        }

        form {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        input {
            width: 98%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        select,
        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input[type="number"],
        input[type="text"],
        input[type="date"],
        select {
            background-color: #f9f9f9;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .link-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .link-container a {
            font-size: 16px;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
        }

        .link-container a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .header h1 {
                font-size: 24px;
            }

            form {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Standardized Header -->
        <div class="header">
            <h1>💰 Expense Manager</h1>
            <div class="user-info">
                <img th:if="${currentUser.pictureUrl}" 
                     th:src="${currentUser.pictureUrl}" 
                     alt="Profile" 
                     class="user-avatar"
                     onerror="this.style.display='none'">
                <span class="user-name" th:text="${currentUser.name}">User Name</span>
                <form method="post" action="/logout" style="display: inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            </div>
        </div>

        <h2 class="page-title">Edit Expense</h2>
        
        <form th:action="@{/edit-expense/{id}(id=${expense.id})}" th:object="${expense}" method="post">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" th:field="*{description}" required>

            <label for="amount">Amount (₹)</label>
            <input type="number" step="0.01" id="amount" name="amount" th:field="*{amount}" required>

            <label for="category">Category</label>
            <select id="category" name="category" th:field="*{category.id}" required>
                <option th:each="cat : ${categories}" 
                        th:value="${cat.id}" 
                        th:text="${cat.name}"
                        th:selected="${cat.id == expense.category.id}">Category Name</option>
            </select>

            <label for="date">Date</label>
            <input type="date" id="date" name="date" th:field="*{date}" required>

            <button type="submit">💾 Update Expense</button>
        </form>

        <div class="link-container">
            <a th:href="@{/expenses}">📊 View All Expenses</a>
            <a th:href="@{/home}">🏠 Return to Dashboard</a>
        </div>

    </div>
</body>

</html>
