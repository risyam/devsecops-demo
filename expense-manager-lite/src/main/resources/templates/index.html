<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Expense Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* Buttons Styling */
        .buttons a {
            text-decoration: none;
            color: #007BFF;
            font-size: 16px;
            font-weight: bold;
            display: inline-block;
            padding: 10px 20px;
            border: 2px solid #007BFF;
            border-radius: 4px;
            margin: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        .buttons a:hover {
            background-color: #007BFF;
            color: white;
        }

        /* Button Layouts */
        .buttons.vertical {
            flex-direction: column;
        }

        .buttons.horizontal {
            flex-direction: row;
        }

        /* Chart and Image Layout */
        .chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }

        .image-container {
            flex: 1;
            text-align: center;
            display: block;
            margin-left: auto;
            /* Pushes the image to the far right */
            width: fit-content;
            /* Keeps the image's width based on its content */
        }

        .image-container img {
            max-width: 90%;
            max-height: 400px;
            margin-right: 0;
            /* Adjust margin to push image right */
        }

        /* Legend Styling */
        .legend-container {
            display: none;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            color: #333;
        }

        .link-container {
            display: flex;
            flex-direction: column;
            /* Stack links vertically */
            justify-content: center;
            align-items: center;
            /* Center-align links horizontally */
            gap: 15px;
            /* Space between each link */
            margin: 20px 0;
        }

        .link-container a {
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            padding: 10px 20px;
            background: #4a90e2;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        /* Display legend if chart is visible */
        .buttons.horizontal[data-chart-visible="true"]~.chart-container .legend-container {
            display: block;
        }
    </style>
</head>

<body>
    <h1>Expense Manager</h1>
    <br />
    <br />

    <div class="container">
        <!-- Buttons Section -->
        <div class="link-container">
            <a th:href="@{/categories}">View Categories</a>
            <a th:href="@{/expenses}">View Expenses</a>
            <a th:href="@{/add-expense}">Add Expense</a>
            <a th:href="@{/add-category}">Add Expense Category</a>
        </div>

        <!-- Chart Section -->
        <div class="chart-container">
            <canvas id="expenseChart"></canvas>
        </div>

        <!-- Image Section -->
        <div class="image-container">
            <img th:src="@{/Image_Home.jpeg}" alt="Home Image" />
        </div>

    </div>
    <script th:inline="javascript">
         // Fetching expense data from Thymeleaf model
         const expenseData = /*[[${expenseData}]]*/ {};
         
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        // Dynamically generate colors based on the number of categories
        const numCategories = Object.keys(expenseData).length;  // Number of categories
        const backgroundColors = Array.from({ length: numCategories }, getRandomColor);       

        // Pie chart data
        const data = {
            labels: Object.keys(expenseData),
            datasets: [{
                data: Object.values(expenseData),
                backgroundColor: backgroundColors  // Use the dynamically generated colors
            }]
        };

        // Create the pie chart
        const ctx = document.getElementById('expenseChart').getContext('2d');
        const expenseChart = new Chart(ctx, {
            type: 'pie',
            data: data,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });
    </script>
</body>

</html>
